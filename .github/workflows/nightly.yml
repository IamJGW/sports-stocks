# The nightly robot (MILESTONE_2_PLAN.md, "The nightly robot"): tools/nightly.py --online, several times each morning
# because GitHub's timer is often late. A run with nothing to do says so; a run that stops fails, and GitHub emails
# about a failed run. Each run also keeps the free Supabase project from going idle.
#
# Runs against the TEST project until Justin OKs live: then change --target test to --target live and the secret to
# SUPABASE_SECRET_KEY (the live project's address comes from config/online.json, which is public).
name: Nightly robot

on:
  schedule:
    # 4:30, 6:30, 9:30 and 12:30 Eastern in standard time (from 1 Nov); an hour later in daylight time.
    - cron: "30 9 * * *"
    - cron: "30 11 * * *"
    - cron: "30 14 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch: {}

concurrency:
  group: nightly-robot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Overnight update
        env:
          TEST_SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_TEST_SECRET_KEY }}
        run: python3 tools/nightly.py --online --target test --quiet
